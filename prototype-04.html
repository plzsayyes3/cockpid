<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpid Prototype 04 — Instrument Panel</title><style>:root{--bg:#15181b;--p:#22272b;--l:#4a5359;--t:#f0eee8;--m:#a6adb0;--a:#f1b85b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#111416,#202529);color:var(--t);font-family:system-ui}main{max-width:1200px;margin:auto;padding:24px}.console{display:grid;grid-template-columns:220px 1fr;gap:18px}.side{border:2px solid var(--l);border-radius:18px;padding:20px;background:#191d20}.dial{width:140px;height:140px;border:10px solid var(--l);border-top-color:var(--a);border-radius:50%;display:grid;place-items:center;margin:15px auto;color:var(--a);font-size:12px}.side h1{font-size:20px;letter-spacing:.12em;text-align:center}.panel{border:2px solid var(--l);border-radius:14px;background:var(--p);padding:16px;margin-bottom:14px;box-shadow:inset 0 0 30px #0002}h2{font-size:12px;letter-spacing:.14em;color:var(--a);margin:0 0 12px}.panel h2:before{content:'● ';font-size:10px}.date{float:right;color:var(--m);font-size:10px}details{background:#1a1f22;border:1px solid #343c42;border-radius:8px;margin:7px 0}summary{padding:11px;cursor:pointer}article{padding:2px 14px 13px}.item p{font-size:12px;color:#c2c6c6;line-height:1.6}.confidence{font-size:10px;color:var(--a)}#connections .item{border-left:4px solid var(--a);padding-left:12px;margin:8px 0}.meta{font-size:10px;color:var(--m)}dialog{background:#222;color:#fff;padding:18px}@media(max-width:800px){.console{grid-template-columns:1fr}.side{display:flex;align-items:center;gap:20px}.dial{margin:0;width:70px;height:70px;border-width:6px}}</style><body><main><div class="console"><aside class="side"><div><h1>COCKPID</h1><div class="dial"><span id="status">SYS</span></div><small>INSTRUMENT PANEL<br>THOUGHT / MEMORY</small></div></aside><div><section class="panel" id="themes"></section><section class="panel" id="ideas"></section><section class="panel" id="actions"></section><section class="panel" id="connections"></section></div></div></main><dialog id="dialog"><input id="tokenInput" type="password"><button id="save">ENGAGE</button></dialog><script src="prototype-common.js"></script><script>boot('instrument')</script></body></html>
