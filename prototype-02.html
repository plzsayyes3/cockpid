<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpid Prototype 02 — Mission Control</title><style>:root{--bg:#070b0d;--p:#0d1518;--l:#284044;--a:#63f0d2;--t:#dcebea;--m:#71898b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle,#10282a,#070b0d 60%);color:var(--t);font-family:monospace}main{max-width:1250px;margin:auto;padding:24px}.hud{border:1px solid var(--l);padding:16px;display:flex;justify-content:space-between;box-shadow:0 0 40px #00ffe511}h1{margin:0;letter-spacing:.25em;font-size:20px;color:var(--a)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.connections{grid-column:1/-1}section{background:#091114dd;border:1px solid var(--l);padding:14px;min-height:220px}h2{font-size:12px;color:var(--a);letter-spacing:.18em;border-bottom:1px solid var(--l);padding-bottom:9px}details{border-bottom:1px solid #1c3235}summary{padding:12px 2px;cursor:pointer;color:#c6dbda}article{padding:4px 12px 14px;font-family:system-ui}.item p{color:#94acab;font-size:12px;line-height:1.55}.date,.meta{color:var(--m);font-size:10px}.date{float:right}.confidence{color:var(--a);font-size:10px}.connections article{border-left:2px solid var(--a);margin:8px 0;padding-left:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.connections{grid-column:auto}}</style><body><main><header class="hud"><div><h1>COCKPID // MISSION CONTROL</h1><small>THINKING TELEMETRY / TOKYO</small></div><div id="status">BOOTING</div></header><div class="grid"><section id="themes"></section><section id="ideas"></section><section id="actions"></section><section class="connections" id="connections"></section></div></main><dialog id="dialog"><input id="tokenInput" type="password"><button id="save">AUTHORIZE</button></dialog><script src="prototype-common.js"></script><script>boot('mission')</script></body></html>
