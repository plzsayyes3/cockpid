<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpid Prototype 06</title><style>:root{--bg:#0b1014;--p:#111922;--line:#2a3945;--text:#edf4f7;--muted:#82909a;--accent:#79d8c0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1014,#101a20);color:var(--text);font-family:system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:26px 20px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:20px}.brand{font-size:24px;font-weight:700;letter-spacing:.18em}.sub{font-size:10px;color:var(--muted);letter-spacing:.12em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}section{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:16px}.wide{grid-column:1/-1}h2{margin:0 0 9px;font-size:11px;letter-spacing:.18em;color:var(--accent)}details{border-top:1px solid var(--line)}summary{cursor:pointer;padding:13px 2px;font-size:13px;list-style:none}summary::-webkit-details-marker{display:none}summary:before{content:'+';display:inline-block;width:18px;color:var(--accent)}details[open] summary:before{content:'−'}.date{float:right;color:var(--muted);font-size:10px}article{padding:0 20px 14px}.item strong{font-size:14px}.item p{font-size:12px;line-height:1.7;color:#b4c0c7;margin:7px 0}.confidence,.meta{font-size:10px;color:var(--muted)}#connections .item{padding:12px;border:1px solid var(--line);border-radius:8px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.head{align-items:start;gap:12px;flex-direction:column}}</style><body><main><header class="head"><div><div class="brand">COCKPID</div><div class="sub">PERSONAL THINKING CONTROL DECK</div></div><div class="sub">YESTERDAY → ARCHIVE</div></header><div class="grid"><section id="themes"></section><section id="ideas"></section><section id="actions"></section><section class="wide" id="connections"></section></div></main><dialog id="dialog"><input id="tokenInput" type="password"><button id="save">Save</button></dialog><script src="prototype-common.js"></script><script>boot('hybrid')</script></body></html>
