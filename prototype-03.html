<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpid Prototype 03 — Minimal Archive</title><style>:root{--bg:#f4f2ec;--p:#fffdfa;--l:#ddd8cd;--t:#252522;--m:#88857c;--a:#556b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Georgia,'Yu Mincho',serif}main{max-width:860px;margin:auto;padding:52px 24px}header{margin-bottom:48px}h1{font-size:34px;font-weight:400;margin:0}header small{color:var(--m)}section{border-top:1px solid var(--l);padding:28px 0}h2{font-size:14px;letter-spacing:.16em;color:var(--a);margin:0 0 12px}details{border-top:1px solid #e7e2d8}summary{padding:15px 0;cursor:pointer;font-family:system-ui;font-size:14px}.date{float:right;color:var(--m);font-size:11px}article{padding:0 0 18px}.item strong{font-size:17px;font-weight:500}.item p{color:#68655e;line-height:1.75;font-size:14px}.confidence,.meta{font-family:system-ui;color:var(--m);font-size:10px}#connections .item{padding:14px 0;border-top:1px solid var(--l)}#status{position:fixed;bottom:16px;right:20px;font:10px system-ui;color:var(--m)}dialog{border:1px solid var(--l);padding:18px}@media(max-width:600px){main{padding-top:28px}}</style><body><main><header><h1>Cockpid</h1><small>Personal archive of thought / last seven days</small></header><section id="themes"></section><section id="ideas"></section><section id="actions"></section><section id="connections"></section></main><div id="status"></div><dialog id="dialog"><input id="tokenInput" type="password"><button id="save">Save</button></dialog><script src="prototype-common.js"></script><script>boot('archive')</script></body></html>
