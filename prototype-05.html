<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpid Prototype 05 — Command Deck</title><style>:root{--bg:#0c0e12;--p:#131720;--l:#283142;--t:#edf2fa;--m:#7f8a9c;--a:#8ca6ff;--b:#8ce6c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:18px}.top{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;border-bottom:1px solid var(--l);padding-bottom:16px}.logo{font-weight:700;letter-spacing:.2em}.metric{border:1px solid var(--l);padding:8px 14px;border-radius:7px;font-size:11px;color:var(--m)}.metric b{color:var(--b)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:14px}.themes{grid-column:span 7}.ideas{grid-column:span 5}.actions{grid-column:span 5}.connections{grid-column:span 7}section{background:var(--p);border:1px solid var(--l);border-radius:9px;padding:15px;min-width:0}h2{font-size:11px;letter-spacing:.15em;margin:0 0 12px;color:var(--a);display:flex;justify-content:space-between}h2:after{content:'ARCHIVE';font-size:9px;color:var(--m);font-weight:400}details{border-top:1px solid #222b3a}summary{padding:11px 0;cursor:pointer;font-size:12px}.date{float:right;color:var(--m);font-size:10px}article{padding:2px 0 13px}.item strong{font-size:13px}.item p{font-size:12px;color:#abb5c4;line-height:1.6}.confidence{font-size:10px;color:var(--b)}#connections .item{background:#0f131b;border:1px solid #222b3a;padding:11px;margin:8px 0;border-radius:6px}.meta{font-size:10px;color:var(--m);word-break:break-all}dialog{background:#131720;color:#fff;border:1px solid var(--l);padding:20px}@media(max-width:850px){.top{grid-template-columns:1fr}.themes,.ideas,.actions,.connections{grid-column:1/-1}}</style><body><main><header class="top"><div class="logo">COCKPID / COMMAND DECK</div><div class="metric">WINDOW <b>LAST 7 DAYS</b></div><div class="metric" id="status">SYNCING</div></header><div class="grid"><section class="themes" id="themes"></section><section class="ideas" id="ideas"></section><section class="actions" id="actions"></section><section class="connections" id="connections"></section></div></main><dialog id="dialog"><input id="tokenInput" type="password"><button id="save">CONNECT</button></dialog><script src="prototype-common.js"></script><script>boot('deck')</script></body></html>
