<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpid Prototype 07 — Flight Computer</title><style>:root{--bg:#0a0d0e;--panel:#151a19;--line:#3a4541;--text:#e5e8df;--muted:#89918a;--accent:#c9d36b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px}.bar{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:12px 16px;background:var(--panel);border-radius:4px}.logo{font-weight:800;letter-spacing:.2em}.readout{font:11px monospace;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px}section{grid-column:span 3;border:1px solid var(--line);background:var(--panel);padding:14px;border-radius:4px}.wide{grid-column:1/-1}h2{font:700 11px monospace;letter-spacing:.2em;color:var(--accent);margin:0 0 10px}details{border-top:1px solid var(--line)}summary{padding:12px 4px;cursor:pointer;font:12px monospace;list-style:none}summary:before{content:'[+] ';color:var(--accent)}details[open] summary:before{content:'[-] '}.date{float:right;color:var(--muted)}article{padding:0 15px 13px}.item strong{font-size:13px}.item p{font-size:12px;line-height:1.65;color:#b5bbb4}.confidence,.meta{font:10px monospace;color:var(--muted)}#connections .item{border-top:1px dashed var(--line);padding-top:10px;margin-top:5px}@media(max-width:700px){section,.wide{grid-column:1/-1}}</style><body><main><header class="bar"><div><div class="logo">COCKPID</div><div class="meta">FLIGHT COMPUTER / DAILY THOUGHT</div></div><div class="readout" id="status">INIT</div></header><div class="grid"><section id="themes"></section><section id="ideas"></section><section id="actions"></section><section class="wide" id="connections"></section></div></main><dialog id="dialog"><input id="tokenInput" type="password"><button id="save">Save</button></dialog><script src="prototype-common.js"></script><script>boot('flight')</script></body></html>
