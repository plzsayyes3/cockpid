<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f0eb">
<title>AI Advice — COCKPID</title>
<link rel="stylesheet" href="advice.css">
</head>
<body>
<div class="advice-shell">
  <header class="advice-top">
    <a class="back" href="index.html">← WORKBENCH</a>
    <div class="title">AI ADVICE<small>my-storage-note / advice</small></div>
    <div class="count" id="adviceCount">--</div>
  </header>
  <main class="mailbox" id="mailbox">
    <aside class="inbox-pane">
      <div class="pane-head"><span>INBOX</span><span id="unreadCount">0 unread</span></div>
      <div class="advice-list" id="adviceList"><div class="loading">読み込んでいます…</div></div>
    </aside>
    <article class="message-pane" id="messagePane">
      <button class="mobile-back" id="messageBack">← INBOX</button>
      <div class="message-meta" id="messageMeta">SELECT A MESSAGE</div>
      <div class="message-body" id="messageBody"><div class="empty-message">AIから届いたアドバイスを、ここで読む。</div></div>
    </article>
  </main>
</div>
<script src="prototype-common.js"></script>
<script src="advice.js"></script>
</body>
</html>
