<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpid</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:32px;background:#f6f6f3;color:#222}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}section{background:white;border:1px solid #ddd;border-radius:14px;padding:18px}h1,h2{margin-top:0}.item{padding:12px 0;border-top:1px solid #eee}.item:first-child{border-top:0}.meta{font-size:12px;color:#777}#status{font-size:13px;color:#777}.source{font-size:11px;color:#999;margin-top:4px}dialog{border:1px solid #ccc;border-radius:12px;padding:20px;max-width:480px}input{width:100%;box-sizing:border-box;padding:10px;margin:8px 0 12px}button{padding:9px 14px;cursor:pointer}.settings{font-size:13px}
</style>
</head>
<body>
<header><div><h1>Cockpid</h1><div id="status">Storage connection required</div></div><button id="settings" class="settings">Storage settings</button></header>
<div class="grid"><section><h2>Ideas</h2><div id="ideas"></div></section><section><h2>Actions</h2><div id="actions"></div></section><section><h2>Themes</h2><div id="themes"></div></section><section><h2>Serendipity</h2><div id="connections"></div></section></div>
<dialog id="dialog"><h2>Storage connection</h2><p>Private GitHub repositoryを読むためのGitHub tokenを入力してください。tokenはこのブラウザのlocalStorageにのみ保存します。</p><label>GitHub token<input id="tokenInput" type="password" autocomplete="off" spellcheck="false"></label><div><button id="save">Save & connect</button> <button id="clear">Clear</button> <button id="close">Cancel</button></div></dialog>
<script>
const OWNER='plzsayyes3',REPO='my-storage-note',TOKEN_KEY='cockpid.github.token';
function getJSTDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function makePaths(date){return{ideas:`extracted/idea/${date}.json`,actions:`extracted/action/${date}.json`,themes:`extracted/theme/${date}.json`,connections:'connections/semantic.json'}}
const getToken=()=>localStorage.getItem(TOKEN_KEY)||'';
function decodeBase64Utf8(value){const binary=atob(value.replace(/\n/g,''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
async function load(path){const t=getToken();if(!t)throw new Error('GitHub token is not configured');const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=main`,{headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${t}`}});if(!r.ok){if(r.status===401||r.status===403)throw new Error('Token is invalid or lacks repository access');if(r.status===404)throw new Error(`Storage file not found: ${path}`);throw new Error(`${path} ${r.status}`)}const j=await r.json();return JSON.parse(decodeBase64Utf8(j.content))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(id,items,date){document.getElementById(id).innerHTML=items.length?items.map(x=>`<div class="item"><strong>${esc(x.title||'Untitled')}</strong><p>${esc(x.summary||'')}</p><div class="meta">${x.confidence==null?'':`confidence ${Math.round(x.confidence*100)}%`}</div><div class="source">source: ${esc(x.source?.date||date)}</div></div>`).join(''):'<div class="meta">No items</div>'}
async function main(){const date=getJSTDate();try{const paths=makePaths(date);const[i,a,t,c]=await Promise.all([load(paths.ideas),load(paths.actions),load(paths.themes),load(paths.connections)]);render('ideas',i.items||[],date);render('actions',a.items||[],date);render('themes',t.items||[],date);document.getElementById('connections').innerHTML=(c.connections||[]).map(x=>`<div class="item"><strong>${Math.round(x.score*100)}% connection</strong><p>${esc(x.reason)}</p><div class="meta">${esc(x.from)} → ${esc(x.to)}</div></div>`).join('')||'<div class="meta">No connections</div>';document.getElementById('status').textContent=`Connected to private my-storage-note · ${date}`;}catch(e){document.getElementById('status').textContent=e.message}}
const settingsButton=document.getElementById('settings'),saveButton=document.getElementById('save'),clearButton=document.getElementById('clear'),closeButton=document.getElementById('close'),dialog=document.getElementById('dialog'),tokenInput=document.getElementById('tokenInput');
settingsButton.onclick=()=>{tokenInput.value=getToken();dialog.showModal()};
saveButton.onclick=()=>{const value=tokenInput.value.trim();if(!value){tokenInput.focus();return;}localStorage.setItem(TOKEN_KEY,value);dialog.close();main()};
clearButton.onclick=()=>{localStorage.removeItem(TOKEN_KEY);tokenInput.value='';dialog.close();document.getElementById('status').textContent='Storage connection cleared'};
closeButton.onclick=()=>dialog.close();
main();
</script>
</body></html>
