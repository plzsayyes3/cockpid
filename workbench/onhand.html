<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f2">
<title>COCKPID — ON HAND</title>
<link rel="stylesheet" href="onhand.css">
</head>
<body>
<main class="onhand-shell">
  <header class="onhand-head">
    <div>
      <div class="eyebrow">6 / ON HAND</div>
      <h1>Do / Check / Keep</h1>
      <p id="sourceRange">LAST 7 DAYS · LOADING</p>
    </div>
    <div class="filters" role="group" aria-label="表示フィルター">
      <button class="filter is-active" data-filter="all">ALL</button>
      <button class="filter" data-filter="open">OPEN</button>
      <button class="filter" data-filter="done">DONE</button>
      <button class="filter" data-filter="skip">SKIP</button>
    </div>
  </header>

  <section class="onhand-grid" aria-live="polite">
    <article class="lane" data-lane="do">
      <div class="lane-head"><h2>Do</h2><span id="fullDoCount">—</span></div>
      <div class="lane-list" id="fullDoItems"><div class="empty">読み込み中…</div></div>
    </article>
    <article class="lane" data-lane="check">
      <div class="lane-head"><h2>Check</h2><span id="fullCheckCount">—</span></div>
      <div class="lane-list" id="fullCheckItems"><div class="empty">読み込み中…</div></div>
    </article>
    <article class="lane" data-lane="keep">
      <div class="lane-head"><h2>Keep</h2><span id="fullKeepCount">—</span></div>
      <div class="lane-list" id="fullKeepItems"><div class="empty">読み込み中…</div></div>
    </article>
  </section>
</main>
<script src="onhand-shared-state.js"></script>
<script src="onhand.js"></script>
<script src="onhand-scheduling-bridge.js"></script>
</body>
</html>
