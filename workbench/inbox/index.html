<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbox Manager</title>
<link rel="stylesheet" href="inbox.css?v=20261126-layout">
</head>
<body><main>
<header class="page-head"><a class="back" href="../">‹ 作業台</a><div class="eyebrow">WORKBENCH / INBOX</div><h1>Inbox Manager</h1><p class="subtitle">メモをDailyへ転送</p></header>
<section class="panel" aria-label="転送操作">
<nav aria-label="操作">
<button id="pull" class="refresh" title="Inbox取得・プレビュー"><span aria-hidden="true">↻</span> 取得</button>
<div class="transfer-actions"><button id="one" disabled>1件転送</button><button id="all" class="primary" disabled>全件転送 <span aria-hidden="true">→</span></button></div>
<button id="pause" class="pause" title="現在の1件が終了したら停止" disabled><span aria-hidden="true">Ⅱ</span> 停止</button>
</nav>
<div class="summary"><h2 id="status" role="status">未取得</h2><p id="counts"></p><progress id="progress" value="0" max="1"></progress></div>
<div id="list"></div>
</section>
<details class="logs"><summary>処理ログ</summary><pre id="log" aria-live="polite"></pre></details>
</main><script src="../../prototype-common.js?v=20261125-images"></script><script type="module" src="controller.js?v=20261126-layout"></script></body></html>
