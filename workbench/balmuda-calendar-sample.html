<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>BALMUDA Scheduler Axis Morph Prototype</title>
<style>
:root{
  --bg:#171819;--panel:#1d1e20;--ink:#f1f1ed;--muted:#92938f;
  --line:rgba(255,255,255,.10);--today:#d45f55;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
header{
  flex:0 0 auto;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;
  padding:calc(11px + env(safe-area-inset-top)) 14px 9px;border-bottom:1px solid var(--line);
  background:rgba(23,24,25,.96);backdrop-filter:blur(14px);z-index:20
}
.eyebrow{font:700 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
h1{margin:0;font-size:20px;line-height:1;font-weight:560;letter-spacing:-.03em}
.mode{text-align:right}
#modeLabel{display:block;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}
#rangeLabel{display:block;margin-top:5px;font:9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.hint{flex:0 0 auto;padding:6px 11px;border-bottom:1px solid var(--line);background:var(--panel);color:var(--muted);font:9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}
#viewport{position:relative;flex:1 1 auto;min-height:0;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:var(--bg)}
#surface{position:relative;min-height:100%}
#svgRenderer{position:sticky;top:0;display:block;width:100%;height:100%;pointer-events:none;background:var(--bg)}
.anchor-guide{position:absolute;left:0;right:0;height:1px;background:rgba(212,95,85,.9);z-index:30;pointer-events:none;opacity:0}
.anchor-guide::before{content:"PINCH CENTER";position:absolute;left:7px;top:-11px;padding:1px 3px;background:var(--bg);color:var(--today);font:700 7px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.anchor-guide.show{opacity:.9}
.zoom-meter{position:absolute;right:7px;bottom:calc(9px + env(safe-area-inset-bottom));width:5px;height:72px;border-radius:999px;background:rgba(255,255,255,.12);z-index:30;pointer-events:none}
.zoom-meter i{position:absolute;left:1px;right:1px;bottom:1px;border-radius:999px;background:#ddd;height:50%}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">AXIS MORPH / SAME OBJECTS</div>
      <h1 id="focusTitle">2026.09</h1>
    </div>
    <div class="mode">
      <span id="modeLabel">WEEK</span>
      <span id="rangeLabel">7 DAYS</span>
    </div>
  </header>
  <div class="hint">Days→Dayで、時間の縦線・予定バー・ラベルが同じオブジェクトのまま移動／回転／伸縮</div>
  <div id="viewport">
    <div id="surface"><svg id="svgRenderer" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="anchor-guide" id="anchorGuide"></div>
    <div class="zoom-meter"><i id="zoomMeter"></i></div>
  </div>
</div>

<script>
(function(){
'use strict';

var DAY_MS=86400000;
var startDate=new Date('2026-01-01T00:00:00+09:00');
var endDate=new Date('2027-04-01T00:00:00+09:00');
var todayKey='2026-09-21';
var COLORS=['#7e8fd7','#d47b55','#77a687','#b083c4','#c7a958','#78a7c7','#ce7070'];

var viewport=document.getElementById('viewport');
var surface=document.getElementById('surface');
var svg=document.getElementById('svgRenderer');
var anchorGuide=document.getElementById('anchorGuide');
var zoomMeter=document.getElementById('zoomMeter');
var focusTitle=document.getElementById('focusTitle');
var modeLabel=document.getElementById('modeLabel');
var rangeLabel=document.getElementById('rangeLabel');

var allDays=[];
for(var t=startDate.getTime();t<endDate.getTime();t+=DAY_MS)allDays.push(new Date(t));

var eventsByDate=new Map();
var allDayByDate=new Map();

function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function minutes(s){var p=s.split(':').map(Number);return p[0]*60+p[1]}
function timePct(s){return minutes(s)/1440}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function smooth(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}
function logLerp(a,b,t){return Math.exp(lerp(Math.log(a),Math.log(b),t))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function addEvent(date,start,end,title,color){
  if(!eventsByDate.has(date))eventsByDate.set(date,[]);
  eventsByDate.get(date).push({date:date,start:start,end:end,title:title,color:color});
}
function addAllDay(date,title,color){
  if(!allDayByDate.has(date))allDayByDate.set(date,[]);
  allDayByDate.get(date).push({date:date,title:title,color:color});
}

allDays.forEach(function(d,i){
  var key=dateKey(d),dow=d.getDay();
  if(dow!==0&&((i*7)%11)<7)addEvent(key,'09:00','10:00',i%5===0?'朝MTG':'作業時間',COLORS[i%COLORS.length]);
  if(((i*13)%17)<8){
    var h=11+(i%6);
    addEvent(key,String(h).padStart(2,'0')+':00',String(Math.min(23,h+1)).padStart(2,'0')+':30',
      ['資料作成','打ち合わせ','研修','制作','面談','レビュー'][i%6],COLORS[(i+2)%COLORS.length]);
  }
  if(((i*5)%23)<5)addEvent(key,'15:00','17:00',['外出','園内研修','家族','撮影'][i%4],COLORS[(i+4)%COLORS.length]);
  if(i%9===0)addAllDay(key,['リモート','行事','休み'][i%3],COLORS[(i+1)%COLORS.length]);
});
[
 ['2026-09-19','09:30','11:00','家族の予定',COLORS[6]],
 ['2026-09-19','13:00','14:30','個人制作',COLORS[4]],
 ['2026-09-20','11:00','12:00','買い物',COLORS[2]],
 ['2026-09-21','08:30','09:15','朝会',COLORS[0]],
 ['2026-09-21','14:00','16:00','園内研修',COLORS[1]],
 ['2026-09-22','10:00','11:30','面談',COLORS[3]],
 ['2026-09-23','12:00','15:00','外出',COLORS[5]],
 ['2026-09-24','09:00','10:00','ミーティング',COLORS[0]],
 ['2026-09-25','15:30','17:00','資料作成',COLORS[2]]
].forEach(function(e){addEvent(e[0],e[1],e[2],e[3],e[4])});

var zoom=.62,targetZoom=zoom,visualZoom=zoom,pinch=null,raf=0;
var PINCH_GAIN=.19;

var stops=[
  {z:0.00,days:365},
  {z:0.17,days:30},
  {z:0.39,days:14},
  {z:0.57,days:7},
  {z:0.76,days:4},
  {z:0.84,days:2.6}
];

function visibleDaysFor(z){
  var zz=Math.min(z,.84);
  for(var i=0;i<stops.length-1;i++){
    var a=stops[i],b=stops[i+1];
    if(zz>=a.z&&zz<=b.z)return logLerp(a.days,b.days,(zz-a.z)/(b.z-a.z));
  }
  return zz<=0?365:2.6;
}
function morphFor(z){return smooth(.82,.975,z)}
function timelineRowHeight(z){return viewport.clientHeight/visibleDaysFor(z)}
function dayBlockHeight(z){
  var hour=lerp(30,46,smooth(.90,1,z));
  return 40+24*hour;
}
function unitHeightFor(z){return lerp(timelineRowHeight(z),dayBlockHeight(z),morphFor(z))}
function modeFor(z){
  if(z>=.93)return'DAY';
  if(z>=.76)return'DAYS';
  if(z>=.57)return'WEEK';
  if(z>=.39)return'WEEKS';
  if(z>=.17)return'MONTH';
  return'YEAR';
}
function rangeFor(z){
  var m=modeFor(z);
  if(m==='DAY')return'1 DAY';
  if(m==='WEEK')return'7 DAYS';
  if(m==='YEAR')return'1 YEAR';
  return Math.round(visibleDaysFor(z))+' DAYS';
}
function setSurfaceHeight(z){
  surface.style.height=(allDays.length*unitHeightFor(z)+viewport.clientHeight*.35)+'px';
}
function setGuide(y,show){
  anchorGuide.style.top=Math.max(0,y)+'px';
  anchorGuide.classList.toggle('show',!!show);
}
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
function centerY(a,b){
  var r=viewport.getBoundingClientRect();
  return ((a.clientY+b.clientY)/2)-r.top;
}
function updateHeader(z){
  modeLabel.textContent=modeFor(z);
  rangeLabel.textContent=rangeFor(z);
  zoomMeter.style.height=(z*100)+'%';
  var u=unitHeightFor(z);
  var idx=clamp(Math.floor((viewport.scrollTop+viewport.clientHeight*.38)/u),0,allDays.length-1);
  var d=allDays[idx];
  focusTitle.textContent=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0');
}
function rectLerp(a,b,t){
  return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),w:lerp(a.w,b.w,t),h:lerp(a.h,b.h,t),r:lerp(a.r||0,b.r||0,t)};
}
function pointLerp(a,b,t){return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)}}

function draw(z){
  var w=viewport.clientWidth,hv=viewport.clientHeight,u=unitHeightFor(z),scroll=viewport.scrollTop;
  var p=morphFor(z);
  var first=clamp(Math.floor(scroll/u)-2,0,allDays.length-1);
  var last=clamp(Math.ceil((scroll+hv)/u)+2,0,allDays.length-1);

  svg.style.height=hv+'px';
  svg.setAttribute('viewBox','0 0 '+w+' '+hv);
  svg.setAttribute('width',w);svg.setAttribute('height',hv);

  var railW=27,dateW=40,allDayW=40,timeLeft=railW+dateW+allDayW,right=7;
  var timeW=Math.max(90,w-timeLeft-right);
  var dayLeft=railW+dateW+8,dayRight=8,dayMainW=w-dayLeft-dayRight;
  var dayHeader=40;
  var hourH=Math.max(4,(u-dayHeader)/24);

  var out=['<rect width="'+w+'" height="'+hv+'" fill="#171819"/>'];

  for(var i=first;i<=last;i++){
    var d=allDays[i],key=dateKey(d),base=i*u-scroll,dow=d.getDay();
    if(base>hv||base+u<0)continue;

    var arr=(eventsByDate.get(key)||[]).slice().sort(function(a,b){return minutes(a.start)-minutes(b.start)});
    var monthStart=d.getDate()===1;
    var rowAlpha=lerp(.11,.22,p);

    // Date-row boundary remains the same object and simply spreads apart as the day expands.
    out.push('<line x1="'+railW+'" y1="'+base+'" x2="'+w+'" y2="'+base+'" stroke="rgba(255,255,255,'+(monthStart?.24:rowAlpha)+')" stroke-width="1"/>');

    // Focus date label moves into the Day header instead of being replaced.
    var dateFrom={x:railW+7,y:base+Math.min(u*.55,16)};
    var dateTo={x:railW+7,y:base+17};
    var dp=pointLerp(dateFrom,dateTo,p);
    var dc=key===todayKey?'#d45f55':(dow===0?'#c8736c':dow===6?'#759ac5':'#e4e4df');
    var dateAlpha=clamp(lerp(smooth(.08,.25,z),1,p),0,1);
    out.push('<text x="'+dp.x+'" y="'+dp.y+'" fill="'+dc+'" opacity="'+dateAlpha+'" font-size="'+lerp(lerp(8,15,smooth(.18,.62,z)),17,p)+'" font-family="-apple-system,sans-serif">'+d.getDate()+'</text>');

    var wd=['日','月','火','水','木','金','土'][dow];
    out.push('<text x="'+(railW+30)+'" y="'+lerp(base+15,base+16,p)+'" fill="#91928f" opacity="'+smooth(.55,.90,z)+'" font-size="7" font-family="-apple-system,sans-serif">('+wd+')</text>');

    // Time grid: the SAME line rotates from vertical (Days) to horizontal (Day).
    var gridAlpha=lerp(smooth(.20,.45,z),1,p);
    for(var hh=0;hh<=24;hh+=3){
      var xN=timeLeft+timeW*(hh/24);
      var n1={x:xN,y:base},n2={x:xN,y:base+u};
      var yD=base+dayHeader+(u-dayHeader)*(hh/24);
      var d1={x:dateW,y:yD},d2={x:w,y:yD};
      var l1=pointLerp(n1,d1,p),l2=pointLerp(n2,d2,p);
      out.push('<line x1="'+l1.x+'" y1="'+l1.y+'" x2="'+l2.x+'" y2="'+l2.y+'" stroke="rgba(255,255,255,'+(0.055+0.075*gridAlpha)+')" stroke-width="1"/>');

      // Time label follows the grid line from top-axis position to left-axis position.
      if(hh<24){
        var tlFrom={x:xN+2,y:base+9};
        var tlTo={x:dayLeft-7,y:yD+8};
        var tp=pointLerp(tlFrom,tlTo,p);
        var ta=lerp(smooth(.32,.58,z),1,p);
        out.push('<text x="'+tp.x+'" y="'+tp.y+'" fill="#9d9e9b" opacity="'+ta+'" font-size="7" text-anchor="'+(p>.55?'end':'start')+'" font-family="ui-monospace,Menlo,monospace">'+String(hh).padStart(2,'0')+':00</text>');
      }
    }

    // Month rail drifts toward the day header edge instead of disappearing abruptly.
    if(monthStart||p>.72){
      var monthAlpha=monthStart?lerp(.72,.35,p):smooth(.72,.96,p)*.28;
      out.push('<text x="'+(railW*.42)+'" y="'+(base+Math.min(u*.5,34))+'" fill="#8e8f8d" opacity="'+monthAlpha+'" font-size="'+lerp(9,7,p)+'" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 '+(railW*.42)+' '+(base+Math.min(u*.5,34))+')" font-family="ui-monospace,Menlo,monospace">'+d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'</text>');
    }

    // All-day event moves from a fixed left column into the day header.
    var allDay=allDayByDate.get(key)||[];
    allDay.slice(0,2).forEach(function(ev,j){
      var from={x:railW+dateW+3,y:base+u*.18+j*7,w:allDayW-6,h:6,r:2};
      var to={x:dayLeft+34+j*(dayMainW*.31),y:base+5,w:dayMainW*.27,h:13,r:2};
      var rr=rectLerp(from,to,p);
      out.push('<rect x="'+rr.x+'" y="'+rr.y+'" width="'+rr.w+'" height="'+rr.h+'" rx="'+rr.r+'" fill="'+ev.color+'" opacity=".92"/>');
      if(rr.h>9){
        out.push('<text x="'+(rr.x+3)+'" y="'+(rr.y+rr.h-3)+'" fill="#efefeb" opacity="'+smooth(.68,.90,z)+'" font-size="7" font-family="-apple-system,sans-serif">'+esc(ev.title)+'</text>');
      }
    });

    // Timed events: one object, one identity, two coordinate systems, continuous interpolation.
    var timelineEh=Math.max(1.4,Math.min(12,u*.18));
    var lanes=Math.max(1,arr.length);
    var laneGap=Math.max(.6,Math.min(1.2,timelineEh*.12));
    var contentH=lanes*timelineEh+(lanes-1)*laneGap;
    var cols=Math.min(3,Math.max(1,arr.length));
    var dayColW=(dayMainW-6)/cols;

    arr.forEach(function(ev,j){
      var xN=timeLeft+timeW*timePct(ev.start);
      var wN=Math.max(2,timeW*(timePct(ev.end)-timePct(ev.start)));
      var yN=base+Math.max(1,(u-contentH)/2)+j*(timelineEh+laneGap);
      var nonDay={x:xN,y:yN,w:wN,h:timelineEh,r:Math.min(2,timelineEh/2)};

      var sy=base+dayHeader+(minutes(ev.start)/1440)*(u-dayHeader);
      var ey=base+dayHeader+(minutes(ev.end)/1440)*(u-dayHeader);
      var col=j%cols;
      var day={x:dayLeft+col*dayColW,y:sy,w:dayColW-4,h:Math.max(9,ey-sy),r:2};

      var rr=rectLerp(nonDay,day,p);
      var fillOpacity=lerp(.94,.32,p);
      out.push('<rect x="'+rr.x+'" y="'+rr.y+'" width="'+rr.w+'" height="'+rr.h+'" rx="'+rr.r+'" fill="'+ev.color+'" opacity="'+fillOpacity+'"/>');

      // Day-view left accent grows out of the same rectangle.
      if(p>.18){
        out.push('<rect x="'+rr.x+'" y="'+rr.y+'" width="'+lerp(0,3,p)+'" height="'+rr.h+'" rx="1.5" fill="'+ev.color+'" opacity="'+p+'"/>');
      }

      // Label rides inside the moving rectangle.
      var labelFrom={x:nonDay.x+3,y:nonDay.y+Math.min(nonDay.h-1,8)};
      var labelTo={x:day.x+7,y:day.y+11};
      var lp=pointLerp(labelFrom,labelTo,p);
      var titleA=clamp(lerp(smooth(.34,.58,z),1,p),0,1);
      if(rr.w>25&&rr.h>4){
        out.push('<text x="'+lp.x+'" y="'+lp.y+'" fill="#efefeb" opacity="'+titleA+'" font-size="'+lerp(6.4,8,p)+'" font-family="-apple-system,sans-serif">'+esc(ev.title)+'</text>');
      }
    });

    if(key===todayKey){
      out.push('<line x1="'+railW+'" y1="'+base+'" x2="'+w+'" y2="'+base+'" stroke="#d45f55" stroke-width="1.15" opacity=".84"/>');
    }
  }

  svg.innerHTML=out.join('');
  updateHeader(z);
}

function scheduleDraw(){
  if(raf)return;
  raf=requestAnimationFrame(function(){raf=0;draw(visualZoom)});
}

function startPinch(e){
  var ay=centerY(e.touches[0],e.touches[1]);
  var u=unitHeightFor(zoom);
  pinch={
    startDist:dist(e.touches[0],e.touches[1]),
    startZoom:zoom,
    anchorY:ay,
    // Preserve the exact fractional location inside a day.
    anchorIndex:(viewport.scrollTop+ay)/u
  };
  targetZoom=zoom;visualZoom=zoom;setGuide(ay,true);
}

function updatePinch(e){
  var ay=centerY(e.touches[0],e.touches[1]);
  var ratio=dist(e.touches[0],e.touches[1])/pinch.startDist;
  targetZoom=clamp(pinch.startZoom+Math.log(ratio)*PINCH_GAIN,0,1);
  visualZoom=targetZoom;

  var u=unitHeightFor(visualZoom);
  setSurfaceHeight(visualZoom);
  viewport.scrollTop=clamp(pinch.anchorIndex*u-ay,0,Math.max(0,surface.offsetHeight-viewport.clientHeight));
  pinch.anchorY=ay;
  setGuide(ay,true);
  scheduleDraw();
}

function finishPinch(){
  if(!pinch)return;
  zoom=targetZoom;visualZoom=zoom;
  var u=unitHeightFor(zoom);
  setSurfaceHeight(zoom);
  viewport.scrollTop=clamp(pinch.anchorIndex*u-pinch.anchorY,0,Math.max(0,surface.offsetHeight-viewport.clientHeight));
  pinch=null;setGuide(0,false);draw(zoom);
}

viewport.addEventListener('touchstart',function(e){if(e.touches.length===2)startPinch(e)},{passive:true});
viewport.addEventListener('touchmove',function(e){
  if(e.touches.length===2&&pinch){e.preventDefault();updatePinch(e)}
},{passive:false});
viewport.addEventListener('touchend',function(e){if(pinch&&e.touches.length<2)finishPinch()},{passive:true});
viewport.addEventListener('touchcancel',function(){pinch=null;targetZoom=zoom;visualZoom=zoom;setGuide(0,false);draw(zoom)},{passive:true});
viewport.addEventListener('scroll',function(){if(!pinch)scheduleDraw()},{passive:true});

viewport.addEventListener('wheel',function(e){
  if(!(e.ctrlKey||e.metaKey))return;
  e.preventDefault();
  var r=viewport.getBoundingClientRect(),ay=e.clientY-r.top;
  var anchor=(viewport.scrollTop+ay)/unitHeightFor(zoom);
  zoom=clamp(zoom-e.deltaY*.0012,0,1);visualZoom=zoom;targetZoom=zoom;
  setSurfaceHeight(zoom);
  viewport.scrollTop=clamp(anchor*unitHeightFor(zoom)-ay,0,Math.max(0,surface.offsetHeight-viewport.clientHeight));
  draw(zoom);
},{passive:false});

window.addEventListener('resize',function(){setSurfaceHeight(zoom);draw(zoom)});

setSurfaceHeight(zoom);
requestAnimationFrame(function(){
  var target=allDays.findIndex(function(d){return dateKey(d)===todayKey});
  viewport.scrollTop=Math.max(0,target*unitHeightFor(zoom)-viewport.clientHeight*.30);
  draw(zoom);
});
})();
</script>
</body>
</html>
