<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>BALMUDA Calendar Motion Lab</title>
<style>
:root{
  --bg:#f4f2ec;--paper:#fbfaf6;--ink:#20201d;--muted:#8f8d85;
  --line:rgba(32,32,29,.13);--strong:rgba(32,32,29,.28);--accent:#b8665d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{
  flex:0 0 auto;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
  background:rgba(244,242,236,.94);backdrop-filter:blur(14px);z-index:20
}
.eyebrow{font:700 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--muted);margin-bottom:6px}
h1{margin:0;font-size:21px;line-height:1;font-weight:650;letter-spacing:-.03em}
.mode{text-align:right}
#modeLabel{display:block;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}
#scaleLabel{display:block;margin-top:5px;font:9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.motion-switch{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px 7px;
  border-bottom:1px solid var(--line);background:var(--paper)
}
.motion-switch button{
  min-width:0;min-height:46px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--muted);
  font:700 8px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:5px 2px
}
.motion-switch button.active{color:var(--ink);border-color:var(--strong);background:rgba(32,32,29,.055)}
.motion-switch small{display:block;margin-top:3px;font-size:6px;font-weight:600;letter-spacing:0}
.hint{
  flex:0 0 auto;padding:6px 11px;border-bottom:1px solid var(--line);background:var(--paper);
  color:var(--muted);font:9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace
}
#viewport{
  position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;
  background:var(--paper);user-select:none;-webkit-user-select:none
}
#svgRenderer{display:block;width:100%;height:100%;background:var(--paper)}
.anchor-guide{
  position:absolute;left:0;right:0;height:1px;background:var(--accent);z-index:30;pointer-events:none;opacity:0
}
.anchor-guide::before{
  content:"CENTER";position:absolute;left:7px;top:-11px;padding:1px 3px;background:var(--paper);color:var(--accent);
  font:700 7px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em
}
.anchor-guide.show{opacity:.85}
.zoom-meter{
  position:absolute;right:7px;bottom:calc(9px + env(safe-area-inset-bottom));width:6px;height:78px;
  border-radius:999px;background:rgba(32,32,29,.1);z-index:30;pointer-events:none
}
.zoom-meter i{position:absolute;left:1px;right:1px;bottom:1px;border-radius:999px;background:var(--ink);height:50%}
.motion-readout{
  position:absolute;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;pointer-events:none;
  padding:4px 6px;border-radius:7px;background:rgba(251,250,246,.86);backdrop-filter:blur(8px);
  color:var(--muted);font:700 7px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">SVG MOTION LAB / FINGER-CENTERED</div>
      <h1 id="focusTitle">2026.09</h1>
    </div>
    <div class="mode">
      <span id="modeLabel">WEEK</span>
      <span id="scaleLabel">7 DAYS</span>
    </div>
  </header>

  <div class="motion-switch" aria-label="慣性パターン">
    <button type="button" data-motion="direct" class="active">1 DIRECT+<small>速い・止まる</small></button>
    <button type="button" data-motion="silky">2 SILKY<small>軽い慣性</small></button>
    <button type="button" data-motion="float">3 FLOAT<small>中間</small></button>
    <button type="button" data-motion="glide">4 GLIDE<small>よく滑る</small></button>
    <button type="button" data-motion="heavy">5 HEAVY<small>重く長い</small></button>
  </div>

  <div class="hint" id="hint">SVG固定 / 1本指スクロール / 2本指ピンチ / 中心は指2本の中点</div>

  <div id="viewport">
    <svg id="svgRenderer" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="anchor-guide" id="anchorGuide"></div>
    <div class="zoom-meter"><i id="zoomMeter"></i></div>
    <div class="motion-readout" id="motionReadout"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var DAY_MS=86400000;
  var startDate=new Date('2026-01-01T00:00:00+09:00');
  var endDate=new Date('2027-01-01T00:00:00+09:00');

  var viewport=document.getElementById('viewport');
  var svg=document.getElementById('svgRenderer');
  var anchorGuide=document.getElementById('anchorGuide');
  var zoomMeter=document.getElementById('zoomMeter');
  var focusTitle=document.getElementById('focusTitle');
  var modeLabel=document.getElementById('modeLabel');
  var scaleLabel=document.getElementById('scaleLabel');
  var motionReadout=document.getElementById('motionReadout');
  var motionButtons=[].slice.call(document.querySelectorAll('[data-motion]'));

  var presets={
    direct:{label:'1 DIRECT+',scrollGain:1.22,scrollFriction:.82,pinchGain:.18,follow:.72,zoomInertia:0},
    silky:{label:'2 SILKY',scrollGain:1.28,scrollFriction:.89,pinchGain:.20,follow:.48,zoomInertia:.10},
    float:{label:'3 FLOAT',scrollGain:1.36,scrollFriction:.925,pinchGain:.22,follow:.34,zoomInertia:.18},
    glide:{label:'4 GLIDE',scrollGain:1.46,scrollFriction:.952,pinchGain:.235,follow:.26,zoomInertia:.27},
    heavy:{label:'5 HEAVY',scrollGain:1.20,scrollFriction:.965,pinchGain:.195,follow:.18,zoomInertia:.36}
  };
  var presetKey='direct';
  var preset=presets[presetKey];

  var sampleEvents=[
    ['2026-09-17','09:00','10:30','職員会議',''],
    ['2026-09-17','13:30','15:00','研修','soft'],
    ['2026-09-18','10:00','12:00','打ち合わせ',''],
    ['2026-09-18','16:00','17:15','迎え','personal'],
    ['2026-09-19','09:30','11:00','家族の予定','personal'],
    ['2026-09-19','13:00','14:30','個人制作','soft'],
    ['2026-09-20','11:00','12:00','買い物','personal'],
    ['2026-09-21','08:30','09:15','朝会',''],
    ['2026-09-21','14:00','16:00','園内研修',''],
    ['2026-09-22','10:00','11:30','面談',''],
    ['2026-09-23','12:00','15:00','外出','personal'],
    ['2026-09-24','09:00','10:00','ミーティング',''],
    ['2026-09-25','15:30','17:00','資料作成','soft'],
    ['2026-10-03','09:00','13:00','運動会',''],
    ['2026-10-10','11:00','12:00','家族','personal'],
    ['2026-11-06','13:00','15:00','研修',''],
    ['2026-12-18','10:00','11:00','会議','']
  ].map(function(e,i){return{id:i,date:e[0],start:e[1],end:e[2],title:e[3],kind:e[4]}});

  var eventsByDate=new Map();
  sampleEvents.forEach(function(ev){
    if(!eventsByDate.has(ev.date))eventsByDate.set(ev.date,[]);
    eventsByDate.get(ev.date).push(ev);
  });

  var allDays=[];
  for(var t=startDate.getTime();t<endDate.getTime();t+=DAY_MS)allDays.push(new Date(t));

  var minRow=2.35,maxRow=168;
  var zoom=.54,targetZoom=zoom;
  var scrollPos=0,targetScroll=0;
  var gesture=null;
  var animationId=0;
  var inertia=null;

  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function mix(a,b,t){return a+(b-a)*t}
  function rowHeightFor(z){return mix(minRow,maxRow,Math.pow(z,2.15))}
  function maxScrollFor(z){
    return Math.max(0,allDays.length*rowHeightFor(z)-viewport.clientHeight+viewport.clientHeight*.35);
  }
  function dateKey(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function timePct(s){
    var p=s.split(':').map(Number);
    return ((p[0]*60+p[1])/1440)*100;
  }
  function modeForZoom(z){
    if(z>=.88)return['DAY','1 DAY'];
    if(z>=.73)return['DAYS','3 DAYS'];
    if(z>=.56)return['WEEK','7 DAYS'];
    if(z>=.40)return['WEEKS','3 WEEKS'];
    if(z>=.22)return['MONTH','1-2 MONTHS'];
    return['YEAR','1 YEAR'];
  }
  function eventColor(kind){
    return kind==='personal'?'#b8665d':kind==='soft'?'#77746d':'#20201d';
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});
  }
  function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
  function centerY(a,b){
    var r=viewport.getBoundingClientRect();
    return ((a.clientY+b.clientY)/2)-r.top;
  }
  function setGuide(y,show){
    anchorGuide.style.top=Math.max(0,y)+'px';
    anchorGuide.classList.toggle('show',!!show);
  }
  function updateLabels(){
    var m=modeForZoom(zoom);
    modeLabel.textContent=m[0];scaleLabel.textContent=m[1];
    zoomMeter.style.height=(zoom*100)+'%';

    var h=rowHeightFor(zoom);
    var idx=clamp(Math.floor((scrollPos+viewport.clientHeight*.38)/h),0,allDays.length-1);
    var d=allDays[idx];
    focusTitle.textContent=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0');

    motionReadout.textContent=preset.label+'  SCROLL ×'+preset.scrollGain.toFixed(2)+'  PINCH ×'+preset.pinchGain.toFixed(3);
  }

  function draw(){
    var w=viewport.clientWidth,hv=viewport.clientHeight,rowH=rowHeightFor(zoom);
    svg.setAttribute('viewBox','0 0 '+w+' '+hv);
    svg.setAttribute('width',w);svg.setAttribute('height',hv);

    var first=clamp(Math.floor(scrollPos/rowH)-2,0,allDays.length-1);
    var last=clamp(Math.ceil((scrollPos+hv)/rowH)+2,0,allDays.length-1);
    var compact=zoom<.44,year=zoom<.20,left=58,right=8,tw=w-left-right;
    var out=['<rect width="'+w+'" height="'+hv+'" fill="#fbfaf6"/>'];

    for(var i=first;i<=last;i++){
      var d=allDays[i],key=dateKey(d),y=i*rowH-scrollPos;
      var stroke=d.getDate()===1?'rgba(32,32,29,.28)':'rgba(32,32,29,.13)';
      out.push('<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="'+stroke+'" stroke-width="1"/>');

      if(!year){
        var dc=key==='2026-09-19'?'#b8665d':'#8f8d85';
        out.push('<text x="8" y="'+(y+11)+'" fill="'+dc+'" font-size="'+(compact?7:9)+'" font-family="ui-monospace,Menlo,monospace">'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+'</text>');
      }

      if(d.getDate()===1&&rowH>10){
        out.push('<text x="8" y="'+(y+11)+'" fill="#20201d" font-size="9" font-weight="700" font-family="ui-monospace,Menlo,monospace">'+(d.getMonth()+1)+'月</text>');
      }

      out.push('<line x1="'+left+'" y1="'+y+'" x2="'+left+'" y2="'+(y+rowH)+'" stroke="rgba(32,32,29,.13)" stroke-width="1"/>');

      if(!compact){
        [0.25,0.5,0.75].forEach(function(p){
          var x=left+tw*p;
          out.push('<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y+rowH)+'" stroke="rgba(32,32,29,.13)" stroke-width="1"/>');
        });
      }

      (eventsByDate.get(key)||[]).forEach(function(ev){
        var x=left+tw*timePct(ev.start)/100;
        var ew=Math.max(2,tw*(timePct(ev.end)-timePct(ev.start))/100);
        var eh=year?2:compact?5:12,ey=y+rowH/2-eh/2;
        out.push('<rect x="'+x+'" y="'+ey+'" width="'+ew+'" height="'+eh+'" rx="'+(year?0:Math.min(6,eh/2))+'" fill="'+eventColor(ev.kind)+'"/>');
        if(!compact&&!year&&ew>24){
          out.push('<text x="'+(x+4)+'" y="'+(ey+9)+'" fill="#fbfaf6" font-size="8" font-family="-apple-system,sans-serif">'+esc(ev.title)+'</text>');
        }
      });
    }

    svg.innerHTML=out.join('');
    updateLabels();
  }

  function stopInertia(){
    inertia=null;
  }

  function ensureAnimation(){
    if(animationId)return;
    animationId=requestAnimationFrame(frame);
  }

  function frame(){
    animationId=0;
    var active=false;

    if(gesture&&gesture.type==='pinch'){
      zoom += (targetZoom-zoom)*preset.follow;
      scrollPos=gesture.anchorIndex*rowHeightFor(zoom)-gesture.anchorY;
      scrollPos=clamp(scrollPos,0,maxScrollFor(zoom));
      active=Math.abs(targetZoom-zoom)>.00005;
    }else if(inertia){
      if(inertia.type==='scroll'){
        scrollPos+=inertia.v;
        inertia.v*=preset.scrollFriction;
        if(scrollPos<0||scrollPos>maxScrollFor(zoom)){
          scrollPos=clamp(scrollPos,0,maxScrollFor(zoom));
          inertia.v*=.35;
        }
        active=Math.abs(inertia.v)>.08;
        if(!active)inertia=null;
      }else if(inertia.type==='zoom'){
        zoom=clamp(zoom+inertia.v,0,1);
        scrollPos=inertia.anchorIndex*rowHeightFor(zoom)-inertia.anchorY;
        scrollPos=clamp(scrollPos,0,maxScrollFor(zoom));
        inertia.v*=.88;
        active=Math.abs(inertia.v)>.00008 && zoom>0 && zoom<1;
        if(!active){targetZoom=zoom;inertia=null}
      }
    }

    draw();
    if(active||gesture)ensureAnimation();
  }

  function applyPreset(key){
    presetKey=key;preset=presets[key];
    motionButtons.forEach(function(b){b.classList.toggle('active',b.dataset.motion===key)});
    stopInertia();
    targetZoom=zoom;
    draw();
  }

  motionButtons.forEach(function(btn){
    btn.addEventListener('click',function(){applyPreset(btn.dataset.motion)});
  });

  viewport.addEventListener('touchstart',function(e){
    stopInertia();

    if(e.touches.length===1){
      var t=e.touches[0];
      gesture={
        type:'scroll',
        startY:t.clientY,lastY:t.clientY,
        startScroll:scrollPos,lastTime:performance.now(),
        velocity:0
      };
    }else if(e.touches.length===2){
      var ay=centerY(e.touches[0],e.touches[1]);
      var h=rowHeightFor(zoom);
      gesture={
        type:'pinch',
        startDist:dist(e.touches[0],e.touches[1]),
        startZoom:zoom,
        anchorY:ay,
        anchorIndex:(scrollPos+ay)/h,
        lastZoom:zoom,lastTime:performance.now(),
        zoomVelocity:0
      };
      targetZoom=zoom;
      setGuide(ay,true);
    }
    ensureAnimation();
  },{passive:true});

  viewport.addEventListener('touchmove',function(e){
    if(!gesture)return;
    e.preventDefault();

    if(e.touches.length===2){
      if(gesture.type!=='pinch'){
        var ay0=centerY(e.touches[0],e.touches[1]);
        var h0=rowHeightFor(zoom);
        gesture={
          type:'pinch',
          startDist:dist(e.touches[0],e.touches[1]),
          startZoom:zoom,
          anchorY:ay0,
          anchorIndex:(scrollPos+ay0)/h0,
          lastZoom:zoom,lastTime:performance.now(),zoomVelocity:0
        };
      }

      var ay=centerY(e.touches[0],e.touches[1]);
      var ratio=dist(e.touches[0],e.touches[1])/gesture.startDist;
      var nextTarget=clamp(gesture.startZoom+Math.log(ratio)*preset.pinchGain,0,1);
      var now=performance.now();
      var dt=Math.max(8,now-gesture.lastTime);
      gesture.zoomVelocity=(nextTarget-gesture.lastZoom)/(dt/16.67);
      gesture.lastZoom=nextTarget;gesture.lastTime=now;
      gesture.anchorY=ay;
      targetZoom=nextTarget;
      setGuide(ay,true);
      ensureAnimation();

    }else if(e.touches.length===1&&gesture.type==='scroll'){
      var t=e.touches[0],now2=performance.now();
      var dy=t.clientY-gesture.startY;
      targetScroll=gesture.startScroll-dy*preset.scrollGain;
      targetScroll=clamp(targetScroll,0,maxScrollFor(zoom));

      var frameDy=t.clientY-gesture.lastY;
      var dt2=Math.max(8,now2-gesture.lastTime);
      gesture.velocity=(-frameDy*preset.scrollGain)/(dt2/16.67);
      gesture.lastY=t.clientY;gesture.lastTime=now2;
      scrollPos=targetScroll;
      draw();
    }
  },{passive:false});

  viewport.addEventListener('touchend',function(e){
    if(!gesture)return;

    if(gesture.type==='pinch'&&e.touches.length<2){
      zoom=targetZoom;
      scrollPos=gesture.anchorIndex*rowHeightFor(zoom)-gesture.anchorY;
      scrollPos=clamp(scrollPos,0,maxScrollFor(zoom));

      var zv=gesture.zoomVelocity*preset.zoomInertia;
      if(Math.abs(zv)>.0001){
        inertia={
          type:'zoom',
          v:zv,
          anchorY:gesture.anchorY,
          anchorIndex:gesture.anchorIndex
        };
      }

      setGuide(0,false);
      gesture=null;
      draw();
      if(inertia)ensureAnimation();
      return;
    }

    if(gesture.type==='scroll'&&e.touches.length===0){
      inertia={type:'scroll',v:gesture.velocity};
      gesture=null;
      ensureAnimation();
    }
  },{passive:true});

  viewport.addEventListener('touchcancel',function(){
    gesture=null;targetZoom=zoom;setGuide(0,false);
  },{passive:true});

  viewport.addEventListener('wheel',function(e){
    e.preventDefault();
    stopInertia();

    if(e.ctrlKey||e.metaKey){
      var r=viewport.getBoundingClientRect();
      var ay=e.clientY-r.top;
      var idx=(scrollPos+ay)/rowHeightFor(zoom);
      zoom=clamp(zoom-e.deltaY*.0012,0,1);targetZoom=zoom;
      scrollPos=idx*rowHeightFor(zoom)-ay;
    }else{
      scrollPos=clamp(scrollPos+e.deltaY*preset.scrollGain,0,maxScrollFor(zoom));
    }
    draw();
  },{passive:false});

  window.addEventListener('resize',function(){
    scrollPos=clamp(scrollPos,0,maxScrollFor(zoom));
    draw();
  });

  requestAnimationFrame(function(){
    var target=allDays.findIndex(function(d){return dateKey(d)==='2026-09-19'});
    scrollPos=Math.max(0,target*rowHeightFor(zoom)-viewport.clientHeight*.34);
    targetScroll=scrollPos;
    draw();
  });
})();
</script>
</body>
</html>
