<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8">
<title>COCKPID — Backstage</title>
<link rel="stylesheet" href="backstage.css">
</head>
<body>
<div class="backstage-app">
  <header class="backstage-top">
    <div>
      <div class="kicker">PROJECT SHELF</div>
      <h1>Backstage</h1>
      <p>今やらないProjectも残しておく場所。上ほど最近触れたもの。開けば Current / Next から再開できます。</p>
    </div>
    <button class="reload-btn" id="reloadBtn" type="button" aria-label="再読み込み">↻</button>
  </header>

  <section class="desk-strip" aria-labelledby="deskTitle">
    <div class="section-line">
      <span class="section-label" id="deskTitle">DESK</span>
      <span class="section-count" id="deskCount">—</span>
    </div>
    <div class="desk-items" id="deskItems"><span class="quiet">読み込み中…</span></div>
  </section>

  <div class="load-status" id="loadStatus">gpts / projects を読んでいます…</div>

  <main class="backstage-layout">
    <section class="list-pane" id="listPane" aria-labelledby="backstageTitle">
      <div class="section-line backstage-line">
        <span class="section-label" id="backstageTitle">BACKSTAGE</span>
        <span class="section-count" id="projectCount">—</span>
      </div>
      <div class="axis"><span>NEW</span><span></span><span>OLD</span></div>
      <div class="project-list" id="projectList"></div>
    </section>

    <article class="detail-pane" id="detailPane" aria-live="polite">
      <div class="detail-empty" id="detailEmpty">
        <span>PROJECT VIEW</span>
        <p>Projectを選ぶと、正本Markdownをここに表示します。</p>
      </div>
      <div class="detail-content" id="detailContent" hidden></div>
    </article>
  </main>
</div>
<script src="project-source-adapter.js"></script>
<script src="backstage.js"></script>
</body>
</html>
