<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#03070b">
  <title>Stan — Standby</title>
  <link rel="stylesheet" href="stan.css">
</head>
<body>
  <main class="stan-stage" id="stanStage" aria-label="スタンちゃん">
    <a class="stan-control stan-back" href="../" aria-label="作業台へ戻る" title="Workbench">←</a>

    <button class="stan-control camera-toggle" id="cameraToggle" type="button" aria-pressed="false" title="カメラ認識を切り替える">
      <span class="camera-dot" id="cameraDot" data-mode="idle" aria-hidden="true"></span>
      <span class="camera-state" id="cameraState">CAM · OFF</span>
    </button>

    <section class="stan-face" id="stanFace" aria-hidden="true">
      <div class="eye eye-left"><span class="pupil"></span></div>
      <div class="eye eye-right"><span class="pupil"></span></div>
    </section>

    <div class="stan-presence" aria-live="polite">
      <strong>スタンちゃん</strong>
      <span id="stanMood">待ってるよ</span>
    </div>

    <div class="stan-menu-backdrop" id="stanMenuBackdrop" aria-hidden="true"></div>

    <aside class="stan-menu" id="stanMenu" aria-hidden="true" aria-label="スタンちゃんメニュー">
      <header class="stan-menu-header">
        <div>
          <strong>STAN</strong>
          <span>QUICK ACTION</span>
        </div>
        <button class="stan-menu-close" id="stanMenuClose" type="button" aria-label="メニューを閉じる">×</button>
      </header>

      <div class="stan-menu-body">
        <label class="stan-field" for="quickActionUrl">
          <span>ダブルタップで開く場所</span>
          <input id="quickActionUrl" type="text" inputmode="url" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://... / shortcuts://...">
        </label>

        <p class="stan-menu-note">シングルタップでこのメニューを開き、画面をダブルタップすると設定先を開きます。Web URLや shortcuts://・obsidian:// などのURIも使えます。</p>
        <p class="stan-menu-status" id="quickActionStatus" aria-live="polite">未設定</p>

        <div class="stan-menu-actions">
          <button id="saveQuickAction" type="button">保存</button>
          <button id="runQuickAction" type="button">開く</button>
          <button id="clearQuickAction" type="button">消去</button>
        </div>
      </div>
    </aside>

    <p class="stan-hint">STAN / STANDBY</p>
    <video class="camera-feed" id="cameraFeed" playsinline muted></video>
  </main>

  <script type="module" src="stan.js"></script>
</body>
</html>
