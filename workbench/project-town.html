<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#66b5df">
<title>COCKPID — Project Town</title>
<link rel="preload" as="image" href="assets/project-town/character.png">
<link rel="stylesheet" href="project-town.css">
<link rel="stylesheet" href="project-town-activity.css">
</head>
<body>
<div class="town-app">
  <header class="town-topbar">
    <div>
      <div class="town-kicker">PROJECT TOWN</div>
      <h1>プロジェクトの町</h1>
    </div>
    <div class="town-summary" id="townSummary">読み込み中…</div>
    <button class="pixel-button" id="reloadBtn" type="button">↻</button>
  </header>

  <section class="studio" aria-label="Project studio">
    <div class="skyline" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="studio-sign">PROJECT STUDIO</div>
    <div class="room" id="projectRoom">
      <div class="room-loading">gpts / projects を読んでいます…</div>
    </div>
  </section>

  <main class="town-main">
    <section class="pixel-panel project-list-panel">
      <div class="panel-title"><span>🌱 プロジェクト一覧</span><span id="projectCount">—</span></div>
      <div class="project-list" id="projectList"></div>
    </section>
  </main>

  <footer class="town-message">
    <div class="portrait" aria-hidden="true"><span class="hair"></span><span class="face"></span><span class="body"></span></div>
    <div><b id="messageTitle">ようこそ、プロジェクトの町へ。</b><p id="messageText">何をしているかと、どれくらい勢いがあるかを分けて眺めます。</p></div>
  </footer>
</div>

<div class="project-detail-overlay" id="detailOverlay" hidden aria-hidden="true">
  <button class="project-detail-backdrop" type="button" data-detail-close aria-label="Project詳細を閉じる"></button>
  <section class="pixel-panel detail-panel project-detail-modal" id="detailPanel" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
    <div class="panel-title"><span id="detailModalTitle">PROJECT STATUS</span><span id="detailState">—</span></div>
    <button class="project-detail-close" type="button" data-detail-close aria-label="閉じる">×</button>
    <div id="detailContent" class="detail-content">
      <div class="detail-empty">プロジェクトを選ぶと、ここに今の様子が出ます。</div>
    </div>
  </section>
</div>

<script src="project-town-v2.js"></script>
<script src="project-town-ui.js"></script>
</body>
</html>
