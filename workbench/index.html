<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f0eb">
<title>COCKPID — Workbench Preview</title>
<link rel="stylesheet" href="workbench.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">COCKPID<small>WORKBENCH / UNDER CONSTRUCTION</small></div>
    <div class="now"><div id="todayDate">----年--月--日</div><small id="todayTime">--:--</small></div>
  </header>
  <main class="desk">
    <section class="object capture-object">
      <div class="object-label">PUT ANYTHING HERE</div>
      <textarea id="captureText" placeholder="まだ分類しない。思いついたまま置く……"></textarea>
      <div class="capture-actions"><span class="quiet">Ctrl / ⌘ + Enter で 00_inbox へ直接保存</span><button class="action-btn" id="captureBtn">机に置く</button></div>
    </section>

    <section class="object workshop-object">
      <div class="object-head"><span class="object-label">WORKSHOP</span><span class="object-no">SYS</span></div>
      <div class="workshop-state"><span>Techo</span><b>LIVE</b></div>
      <div class="workshop-state"><span>Analysis</span><b>ON</b></div>
      <button class="ghost-btn" id="systemOpen">旧SYSTEM</button>
    </section>

    <div class="calendar-news-grid">
      <section class="object today-object">
        <div class="object-head calendar-head">
          <span class="object-label">CALENDAR / TODAY</span>
          <div class="date-nav" aria-label="日付移動">
            <button class="date-btn" id="prevDate" title="前日">‹</button>
            <button class="date-btn date-label" id="todayDateBtn" title="今日に戻る">--/--</button>
            <button class="date-btn" id="nextDate" title="翌日">›</button>
          </div>
        </div>
        <div class="list" id="todayList"><div class="empty">Techoを読んでいます…</div></div>
      </section>

      <section class="object news-object">
        <div class="object-head"><span class="object-label">NEWS</span><span class="object-no">04</span></div>
        <p>外の世界は、必要な量だけ。</p>
        <span class="state">BUILDING</span>
      </section>
    </div>
  </main>
</div>
<nav class="dock" aria-label="Workbench apps">
  <button class="app-btn" data-app="calendar"><b>1</b><span>Calendar</span></button><button class="app-btn" data-app="tasks"><b>2</b><span>Tasks</span></button><button class="app-btn" data-app="zen"><b>3</b><span>Zen</span></button><button class="app-btn" data-app="news"><b>4</b><span>News</span></button><button class="app-btn" data-app="advice"><b>5</b><span>Advice</span></button><button class="app-btn secret" data-app="secret"><b>9</b><span>???</span></button>
</nav>
<section class="app-window" id="appWindow" aria-hidden="true"><div class="app-frame"><div class="app-frame-head"><span class="app-title" id="appTitle">APP</span><button class="ghost-btn" id="appClose">CLOSE / ESC</button></div><div class="app-content" id="appContent"></div></div></section>
<div class="pet" id="pet" title="Resident"><div class="pet-say" id="petSay"></div><div class="pet-face"></div><div class="pet-shadow"></div></div>
<script src="../prototype-common.js"></script><script src="workbench.js"></script>
</body>
</html>
