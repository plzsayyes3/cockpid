<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f0eb">
<title>Keyboard — Workbench</title>
<style>
:root{--bg:#f1f0eb;--surface:rgba(252,251,247,.94);--ink:#292924;--muted:#8b8880;--accent:#b8665d;--line:rgba(52,50,45,.12);--shadow:0 18px 50px rgba(37,34,29,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font:14px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background-image:radial-gradient(circle at 1px 1px,rgba(30,30,26,.025) 1px,transparent 0);background-size:24px 24px}.keyboard-shell{width:min(720px,100%);margin:0 auto;padding:22px}.keyboard-top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.back{color:var(--muted);font:700 9px ui-monospace,monospace;text-decoration:none;letter-spacing:.08em}.back:hover{color:var(--ink)}.kicker{color:var(--muted);font:700 9px ui-monospace,monospace;letter-spacing:.14em}.keyboard-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:28px}.keyboard-card h1{margin:0;font:600 clamp(28px,6vw,48px)/1.1 Georgia,"Yu Mincho",serif}.keyboard-card p{margin:16px 0;color:#5f5b54;line-height:1.8}.tool-link{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:24px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:rgba(239,238,233,.74);color:var(--ink);text-decoration:none}.tool-link:hover{border-color:#aaa49a;transform:translateY(-1px)}.tool-link strong{display:block}.tool-link span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.arrow{color:var(--accent);font:700 18px ui-monospace,monospace}.note{margin-top:18px;color:var(--muted);font:10px/1.7 ui-monospace,monospace}@media(max-width:520px){.keyboard-shell{padding:14px}.keyboard-card{padding:22px 18px}.keyboard-top{margin-bottom:16px}}
</style>
</head>
<body>
<main class="keyboard-shell">
  <div class="keyboard-top"><a class="back" href="./" aria-label="Workbenchへ戻る">← WORKBENCH</a><span class="kicker">9 / KEYBOARD</span></div>
  <section class="keyboard-card">
    <h1>薙刀式へ。</h1>
    <p>キーボード入力の道具をここにまとめます。Macで薙刀式を使うためのツールを開けます。</p>
    <a class="tool-link" href="https://github.com/eswai/Benkei2" target="_blank" rel="noopener noreferrer">
      <span><strong>Benkei2</strong><span>薙刀式かな入力のMac実装を開く ↗</span></span><b class="arrow">→</b>
    </a>
    <div class="note">外部ツールの設定・インストールはリンク先の説明に従ってください。</div>
  </section>
</main>
</body>
</html>
