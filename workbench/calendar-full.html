<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f0eb">
<title>COCKPID — Month Full</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f1f0eb'/%3E%3Cpath d='M42 21a16 16 0 1 0 0 22' fill='none' stroke='%23292924' stroke-width='6' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="stylesheet" href="calendar-full.css">
</head>
<body>
<div class="full-app">
  <header class="full-top">
    <div class="brand"><b>CALENDAR</b><span>MONTH / FULL</span></div>
    <div class="month-nav">
      <a class="quiet-btn" href="index.html">← WORKBENCH</a>
      <button class="nav-btn" id="prevMonth" aria-label="前月">‹</button>
      <button class="quiet-btn" id="todayMonth">TODAY</button>
      <strong id="monthLabel">----</strong>
      <button class="nav-btn" id="nextMonth" aria-label="翌月">›</button>
    </div>
    <div class="source" id="sourceStatus">BOOTING</div>
  </header>

  <section class="undated" id="undated" hidden>
    <span>MONTH / 日付未定</span>
    <div id="undatedItems"></div>
  </section>

  <main class="month-shell">
    <div class="weekdays" aria-hidden="true"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div></div>
    <div class="month-grid" id="monthGrid"><div class="message">READING MONTH…</div></div>
  </main>
</div>
<script src="../prototype-common.js"></script>
<script src="calendar-full.js"></script>
</body>
</html>
