<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f3ee"><title>カード — 作業台</title>
<link rel="stylesheet" href="cards.css?v=20261106-ocr1">
</head>
<body>
<header class="page-head">
  <div class="head-title"><a href="./" class="home-link" aria-label="作業台に戻る">作業台 /</a><h1>カード</h1><span class="subtitle">手元に置いて、ひとつずつ。</span></div>
  <div class="head-actions"><button id="addImages" class="primary" type="button">＋ 画像を追加</button><button id="toggleInbox" type="button" aria-controls="inboxSidebar" aria-expanded="false">INBOX</button></div>
</header>
<div class="workspace">
<main>
  <div class="board-toolbar">
    <div class="tabs" aria-label="カードの表示"><button id="unhandledTab" aria-pressed="true" type="button">未チェック <span id="openCount">0</span></button><button id="handledTab" aria-pressed="false" type="button">チェック済み</button></div>
    <button id="refreshIdeas" type="button" title="画像カードはそのまま、Ideaを選び直します">Ideaを入れ替え ↻</button>
  </div>
  <p class="board-caption" id="boardCaption">撮ったままのスクショに、もう一度出会う。</p>
  <div id="sourceStatus" role="status" class="source-status">読み込んでいます…</div>
  <div id="cardGrid" class="card-grid" aria-label="画像とIdeaのカード"></div>
  <div id="emptyState" class="empty-state" hidden><span class="empty-mark">＋</span><h2>気になったものを、ここへ。</h2><p>画像を追加すると、メモを添えてカードにできます。<br>貼り付け・ドラッグ＆ドロップにも対応しています。</p><button id="emptyAdd" type="button">画像を追加する</button></div>
</main>
<aside id="inboxSidebar" class="inbox-sidebar" aria-label="INBOXメモ">
  <div class="sidebar-title"><h2>INBOX</h2><span>思いついたことを、そのまま。</span></div>
  <form id="inboxForm"><label for="inboxText">メモ</label><textarea id="inboxText" placeholder="カードを見て思いついたこと…" rows="12"></textarea><div class="inbox-footer"><small>⌘ / Ctrl ＋ Enter</small><button id="sendInbox" class="primary" type="submit">追加する →</button></div></form>
  <p id="inboxStatus" role="status" class="field-status"></p>
  <div class="sidebar-note"><span>ひとつ、片付いたら</span><p>必要なことを済ませたらチェック。<br>カードは消さずに、しまっておけます。</p><span>少し、寄り道</span><p>最近の記録に近いIdeaと、<br>ランダムなIdeaも並びます。</p></div>
</aside>
</div>
<input id="imageFiles" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
<dialog id="uploadDialog" aria-labelledby="uploadTitle"><div class="dialog-head"><h2 id="uploadTitle">画像をカードにする</h2><button type="button" id="closeUpload" aria-label="閉じる">×</button></div><p class="dialog-hint">メモは空のままでも追加できます。</p><div id="uploadItems"></div><p id="uploadStatus" role="status" class="field-status"></p><div class="dialog-footer"><button id="saveUploads" class="primary" type="button">カードを保存</button></div></dialog>
<dialog id="detailDialog" aria-labelledby="detailHeading"><div class="dialog-head"><h2 id="detailHeading">カード</h2><button id="closeDetail" type="button" aria-label="閉じる">×</button></div><div id="detailBody"></div><p id="detailStatus" role="status" class="field-status"></p><div class="dialog-footer" id="detailActions"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script src="../prototype-common.js?v=20260918-workbench-review"></script>
<script src="scrap-model.js?v=20261105-1"></script><script src="scrap-store.js?v=20261105-1"></script><script src="scrap-ocr.js?v=20261106-ocr1"></script><script src="cards.js?v=20261106-ocr1"></script>
</body></html>
