<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#66b5df">
<title>Project Town — Roaming Sample</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#63b6df;color:#13233b;font-family:"Courier New",monospace;image-rendering:pixelated}body{padding:10px}.demo{max-width:980px;margin:auto}.top{background:#1b4f8d;color:white;border:4px solid #102c56;box-shadow:4px 4px 0 #0a1c38;padding:10px 12px;margin-bottom:10px}.top b{display:block;font-size:18px}.top small{font-size:10px}.studio{position:relative;height:min(72vh,620px);min-height:440px;overflow:hidden;background:#ead1a0;border:5px solid #65451f;box-shadow:5px 5px 0 #2d210f}.sky{height:84px;background:#78c9ec;border-bottom:5px solid #65451f;position:relative}.sign{position:absolute;left:12px;top:10px;background:#f8efd7;border:3px solid #5f4729;padding:5px 8px;font-weight:900;z-index:30}.building{position:absolute;bottom:0;background:#d6c18b;border:4px solid #31537f}.b1{left:12%;width:48px;height:38px}.b2{left:27%;width:54px;height:58px}.b3{right:28%;width:58px;height:46px}.b4{right:10%;width:46px;height:64px}.floor{position:absolute;inset:84px 0 0;background:repeating-linear-gradient(0deg,#efdcb4 0 38px,#e1c995 38px 40px),repeating-linear-gradient(90deg,transparent 0 58px,rgba(112,79,40,.08) 58px 60px)}.wall-line{position:absolute;left:0;right:0;top:48%;border-top:3px dashed rgba(95,71,41,.25)}.desk{position:absolute;width:120px;height:54px;background:#8b5628;border:4px solid #4b2e17;z-index:5}.desk:before{content:"";position:absolute;left:12px;top:-31px;width:46px;height:30px;background:#1d3552;border:4px solid #0d1c2e}.desk:after{content:"";position:absolute;left:20px;top:-23px;width:30px;height:14px;background:#72c8f2}.d1{left:9%;top:27%}.d2{right:10%;top:30%}.d3{left:39%;bottom:12%}.sofa{position:absolute;left:8%;bottom:9%;width:115px;height:46px;background:#a68b72;border:4px solid #5f4729;z-index:4;box-shadow:inset 0 12px 0 #c8b395}.window{position:absolute;right:8%;bottom:11%;width:82px;height:78px;background:#80c9e9;border:5px solid #5f4729;z-index:3;box-shadow:inset 0 -18px 0 #d8f1fb}.window:before,.window:after{content:"";position:absolute;background:#5f4729}.window:before{left:35px;top:0;bottom:0;width:4px}.window:after{left:0;right:0;top:31px;height:4px}.plant{position:absolute;right:28%;bottom:7%;width:34px;height:48px;border-bottom:20px solid #9b6233;z-index:4}.plant:before{content:"";position:absolute;width:18px;height:30px;background:#4d8b55;left:8px;top:0;clip-path:polygon(50% 0,100% 38%,70% 100%,50% 60%,30% 100%,0 38%)}
.actor{position:absolute;width:54px;height:54px;z-index:20;transform:translate(-50%,-50%);transition:left var(--move,900ms) linear,top var(--move,900ms) linear;will-change:left,top,transform}.actor.walking{z-index:18}.sprite{position:absolute;inset:0;background-image:url("assets/project-town/character.png");background-repeat:no-repeat;background-size:400% 400%;background-position:0 0;image-rendering:pixelated;image-rendering:crisp-edges;animation:frames 1.7s step-end infinite;transform-origin:center bottom}.actor[data-dir="left"] .sprite{transform:scaleX(-1)}.actor[data-action="idle"] .sprite{background-position-y:0%;animation-duration:1.7s}.actor[data-action="walk"] .sprite{background-position-y:33.333%;animation-duration:.48s}.actor[data-action="work"] .sprite{background-position-y:66.667%;animation-duration:.58s}.actor[data-action="rest"] .sprite{background-position-y:100%;animation-duration:2.1s}.name{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);white-space:nowrap;background:#fff8d8;border:2px solid #5f4729;padding:1px 4px;font-size:8px;font-weight:900}.bubble{position:absolute;left:42px;top:-14px;min-width:46px;max-width:86px;background:#fff;border:3px solid #17233a;padding:3px 4px;font-size:8px;font-weight:900;line-height:1.1;opacity:0;transform:translateY(4px);transition:.15s}.bubble.show{opacity:1;transform:none}.bubble:after{content:"";position:absolute;left:8px;bottom:-6px;width:7px;height:7px;background:white;border-right:3px solid #17233a;border-bottom:3px solid #17233a;transform:rotate(45deg)}.fx{position:absolute;right:-4px;top:-7px;background:#fff36b;border:2px solid #17233a;min-width:18px;height:18px;text-align:center;line-height:14px;font-weight:900;font-size:11px;opacity:0}.fx.show{opacity:1;animation:pop .8s steps(2,end) infinite}.legend{margin-top:10px;background:#fffdf1;border:4px solid #5c3a1d;box-shadow:4px 4px 0 #2d1c0d;padding:9px 11px;font-size:11px;line-height:1.55}.legend b{font-size:12px}.state-dot{display:inline-block;width:9px;height:9px;border:2px solid #243b5d;margin-right:3px;vertical-align:-1px}.hot{background:#fff06b}.active{background:#d8efff}.thinking{background:#e6dcff}.waiting{background:#f6dda1}.paused{background:#ddd7ca}@keyframes frames{0%,24.9%{background-position-x:0}25%,49.9%{background-position-x:33.333%}50%,74.9%{background-position-x:66.667%}75%,100%{background-position-x:100%}}@keyframes pop{0%,49%{margin-top:0}50%,100%{margin-top:-2px}}@media(max-width:680px){body{padding:6px}.studio{height:72vh;min-height:420px}.desk{transform:scale(.82);transform-origin:center}.d1{left:3%}.d2{right:1%}.d3{left:34%}.actor{width:48px;height:48px}.window{right:3%;transform:scale(.85);transform-origin:bottom right}.sofa{left:3%;transform:scale(.85);transform-origin:bottom left}}
</style>
</head>
<body>
<div class="demo">
  <header class="top"><small>PROJECT TOWN / CONCEPT SAMPLE</small><b>みんなが同じスタジオで暮らしている感じ</b></header>
  <main class="studio" id="studio">
    <div class="sky"><span class="building b1"></span><span class="building b2"></span><span class="building b3"></span><span class="building b4"></span></div>
    <div class="sign">PROJECT STUDIO</div>
    <div class="floor"><div class="wall-line"></div></div>
    <div class="desk d1"></div><div class="desk d2"></div><div class="desk d3"></div>
    <div class="sofa"></div><div class="window"></div><div class="plant"></div>
  </main>
  <footer class="legend"><b>サンプル：</b> キャラは各Projectを想定。常時独立して動き、机で作業・窓で待機・中央を歩く・ソファで休むを繰り返します。<br><span class="state-dot hot"></span>勢いあり　<span class="state-dot active"></span>進行中　<span class="state-dot thinking"></span>考え中　<span class="state-dot waiting"></span>待機中　<span class="state-dot paused"></span>休憩中</footer>
</div>
<script>
(()=>{
'use strict';
const studio=document.getElementById('studio');
const projects=[
 {name:'TaskLiner',state:'hot'},
 {name:'COCKPID',state:'active'},
 {name:'Watchy',state:'thinking'},
 {name:'My Internet',state:'active'},
 {name:'Kids 3D',state:'waiting'},
 {name:'Techo',state:'paused'}
];
const spots={
 center:[[34,45],[52,42],[67,55],[45,67],[61,72]],
 desk1:[[17,36]],desk2:[[82,39]],desk3:[[50,76]],
 window:[[88,72]],sofa:[[17,76]]
};
const rules={
 hot:{move:[460,720],choices:['desk1','desk2','desk3','center','center'],stay:[900,2100]},
 active:{move:[650,1000],choices:['desk1','desk2','desk3','center','center','window'],stay:[1200,2700]},
 thinking:{move:[900,1300],choices:['center','center','window','desk3'],stay:[1800,3600]},
 waiting:{move:[1050,1500],choices:['window','window','center','sofa'],stay:[2200,4200]},
 paused:{move:[1200,1800],choices:['sofa','sofa','center'],stay:[3000,6000]}
};
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function addActor(p,i){
 const el=document.createElement('div');
 el.className='actor';el.dataset.action='idle';el.dataset.dir='right';el.dataset.state=p.state;
 el.innerHTML='<span class="sprite"></span><span class="bubble"></span><span class="fx"></span><span class="name"></span>';
 el.querySelector('.name').textContent=p.name;
 studio.appendChild(el);
 const actor={el,p,x:26+(i%3)*22,y:44+Math.floor(i/3)*23,timer:0,phase:Math.random()*Math.PI*2};
 el.style.left=actor.x+'%';el.style.top=actor.y+'%';
 setTimeout(()=>next(actor),300+i*210+Math.random()*800);
 return actor;
}
function say(actor,text,fx=''){
 const b=actor.el.querySelector('.bubble'),f=actor.el.querySelector('.fx');
 b.textContent=text||'';b.classList.toggle('show',!!text);f.textContent=fx;f.classList.toggle('show',!!fx);
}
function actionFor(place){
 if(place.startsWith('desk'))return 'work';
 if(place==='sofa')return 'rest';
 return 'idle';
}
function textFor(place,state){
 if(place.startsWith('desk'))return state==='hot'?'制作中！':'作業中';
 if(place==='window')return state==='waiting'?'まち中…':'うーん';
 if(place==='sofa')return state==='paused'?'zzz':'';
 if(state==='thinking'&&Math.random()<.55)return '考え中…';
 return '';
}
function next(actor){
 const rule=rules[actor.p.state];
 const place=pick(rule.choices),pos=pick(spots[place]);
 const dx=pos[0]-actor.x;actor.el.dataset.dir=dx<0?'left':'right';
 actor.el.dataset.action='walk';actor.el.classList.add('walking');say(actor,'');
 const move=rnd(...rule.move);actor.el.style.setProperty('--move',move+'ms');
 actor.x=pos[0]+rnd(-2,2);actor.y=pos[1]+rnd(-2,2);actor.el.style.left=actor.x+'%';actor.el.style.top=actor.y+'%';
 clearTimeout(actor.timer);actor.timer=setTimeout(()=>{
   actor.el.classList.remove('walking');actor.el.dataset.action=actionFor(place);
   const msg=textFor(place,actor.p.state);let fx='';
   if(actor.p.state==='hot'&&actor.el.dataset.action==='work'&&Math.random()<.35)fx='!';
   if(actor.p.state==='thinking'&&Math.random()<.35)fx='…';
   if(actor.p.state==='paused'&&place==='sofa'&&Math.random()<.65)fx='Z';
   say(actor,msg,fx);
   actor.timer=setTimeout(()=>next(actor),rnd(...rule.stay));
 },move+70);
}
const actors=projects.map(addActor);
let raf=0;
function live(t){
 actors.forEach((a)=>{
   const action=a.el.dataset.action;
   const amp=action==='walk'?1.8:(action==='work'?1.15:(action==='rest'?.35:.65));
   const speed=action==='walk'?.010:(action==='work'?.015:.0045);
   const y=Math.sin(t*speed+a.phase)*amp;
   const x=action==='work'?Math.sin(t*.02+a.phase)*.7:0;
   a.el.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;
 });
 raf=requestAnimationFrame(live);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)raf=requestAnimationFrame(live);
})();
</script>
</body>
</html>
