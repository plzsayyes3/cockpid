<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#66b5df"><title>Project Town — Activity × Momentum</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#63b6df;color:#13233b;font-family:"Courier New",monospace;image-rendering:pixelated}body{padding:10px}.demo{max-width:980px;margin:auto}.top{background:#1b4f8d;color:#fff;border:4px solid #102c56;box-shadow:4px 4px #0a1c38;padding:9px 12px;margin-bottom:10px}.top small{font-size:9px}.top b{display:block;font-size:17px}.studio{position:relative;height:min(72vh,620px);min-height:440px;overflow:hidden;background:#efdcb4;border:5px solid #65451f;box-shadow:5px 5px #2d210f}.sky{height:80px;background:#78c9ec;border-bottom:5px solid #65451f}.sign,.zone{position:absolute;background:#fff8d8;border:3px solid #5f4729;font-weight:900;z-index:8}.sign{left:10px;top:9px;padding:4px 7px}.zone{padding:3px 5px;font-size:9px}.z-work{left:9%;top:20%}.z-research{right:8%;top:20%}.z-review{left:50%;bottom:4%;transform:translateX(-50%)}.desk{position:absolute;left:10%;top:35%;width:135px;height:55px;background:#8b5628;border:4px solid #4b2e17;z-index:5}.desk:before{content:"";position:absolute;left:18px;top:-34px;width:50px;height:32px;background:#1d3552;border:4px solid #0d1c2e}.desk:after{content:"";position:absolute;left:27px;top:-25px;width:32px;height:15px;background:#72c8f2}.shelf{position:absolute;right:8%;top:31%;width:125px;height:150px;background:#895b32;border:5px solid #4b2e17;z-index:5}.shelf:before{content:"▥ ▥ ▥\A▥ ▥ ▥\A▥ ▥ ▥";white-space:pre;position:absolute;inset:8px;background:#d9b26f;border:3px solid #4b2e17;color:#31537f;font-size:26px;line-height:38px;text-align:center}.counter{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);width:150px;height:52px;background:#f1c86a;border:4px solid #5f4729;z-index:6}.counter:before{content:"あなた / REVIEW";position:absolute;left:50%;top:11px;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:900}.sofa{position:absolute;left:6%;bottom:8%;width:105px;height:42px;background:#a68b72;border:4px solid #5f4729;z-index:4}.actor{position:absolute;width:54px;height:54px;z-index:20;transform:translate(-50%,-50%);transition:left var(--move,900ms) linear,top var(--move,900ms) linear;will-change:left,top,transform}.sprite{position:absolute;inset:0;background:url("assets/project-town/character.png") no-repeat;background-size:400% 400%;image-rendering:pixelated;animation:frames 1.7s step-end infinite}.actor[data-dir="left"] .sprite{transform:scaleX(-1)}.actor[data-action="walk"] .sprite{background-position-y:33.333%;animation-duration:.48s}.actor[data-action="work"] .sprite{background-position-y:66.667%;animation-duration:.58s}.actor[data-action="rest"] .sprite{background-position-y:100%;animation-duration:2.1s}.name{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);white-space:nowrap;background:#fff8d8;border:2px solid #5f4729;padding:1px 4px;font-size:8px;font-weight:900}.bubble{position:absolute;left:40px;top:-15px;min-width:54px;background:#fff;border:3px solid #17233a;padding:3px 4px;font-size:8px;font-weight:900;opacity:0}.bubble.show{opacity:1}.momentum{position:absolute;right:-10px;top:-11px;background:#fff06b;border:2px solid #17233a;padding:1px 3px;font-size:8px;font-weight:900;opacity:0}.actor[data-momentum="rising"] .momentum,.actor[data-momentum="surging"] .momentum{opacity:1}.actor[data-momentum="surging"] .momentum{animation:pop .55s steps(2,end) infinite}.legend{margin-top:10px;background:#fffdf1;border:4px solid #5c3a1d;box-shadow:4px 4px #2d1c0d;padding:9px 11px;font-size:10px;line-height:1.65}.legend b{font-size:11px}.pill{display:inline-block;border:2px solid #243b5d;padding:0 4px;margin:2px;background:#fff}.rise{background:#fff6a5}.surge{background:#fff06b;font-weight:900}@keyframes frames{0%,24.9%{background-position-x:0}25%,49.9%{background-position-x:33.333%}50%,74.9%{background-position-x:66.667%}75%,100%{background-position-x:100%}}@keyframes pop{50%{transform:translateY(-3px)}}@media(max-width:680px){body{padding:6px}.studio{height:72vh;min-height:430px}.desk{left:3%;transform:scale(.8);transform-origin:left center}.shelf{right:2%;transform:scale(.78);transform-origin:right top}.actor{width:48px;height:48px}.counter{width:130px}.z-work{left:3%}.z-research{right:3%}}
</style></head><body><div class="demo"><header class="top"><small>PROJECT TOWN / TWO AXES SAMPLE</small><b>行動ステータス × 勢い</b></header><main class="studio" id="studio"><div class="sky"></div><div class="sign">PROJECT STUDIO</div><div class="zone z-work">💻 作業エリア</div><div class="zone z-research">▥ 調査エリア</div><div class="zone z-review">成果物はこちらへ ↓</div><div class="desk"></div><div class="shelf"></div><div class="counter"></div><div class="sofa"></div></main><footer class="legend"><b>行動ステータス：</b> <span class="pill">作業中 → PC</span><span class="pill">調査中 → 資料棚</span><span class="pill">見てもらい待ち → あなたの所</span><span class="pill">休止 → ソファ</span><br><b>勢い（別軸）：</b> <span class="pill">通常</span><span class="pill rise">↑ 上昇</span><span class="pill surge">↑↑ 急上昇</span>　勢いは居場所を変えず、移動速度・動き・頭上マークだけに反映。</footer></div><script>
(()=>{'use strict';const studio=document.getElementById('studio');
const projects=[{name:'TaskLiner',activity:'working',momentum:'surging'},{name:'COCKPID',activity:'working',momentum:'rising'},{name:'Watchy',activity:'researching',momentum:'normal'},{name:'My Internet',activity:'researching',momentum:'surging'},{name:'Kids 3D',activity:'review_wait',momentum:'rising'},{name:'Techo',activity:'paused',momentum:'normal'}];
const homes={working:[[18,43],[27,48]],researching:[[79,44],[85,54]],review_wait:[[45,72],[55,72],[50,66]],paused:[[13,76]]};const copy={working:'作業中',researching:'調べ中…',review_wait:'見てください！',paused:'休憩中'};const action={working:'work',researching:'idle',review_wait:'idle',paused:'rest'};const speed={normal:1,rising:1.18,surging:1.42};const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function add(p,i){const el=document.createElement('div');el.className='actor';el.dataset.activity=p.activity;el.dataset.momentum=p.momentum;el.dataset.action='idle';el.dataset.dir='right';el.innerHTML='<span class="sprite"></span><span class="bubble"></span><span class="momentum"></span><span class="name"></span>';el.querySelector('.name').textContent=p.name;el.querySelector('.momentum').textContent=p.momentum==='surging'?'↑↑急':p.momentum==='rising'?'↑':'';studio.appendChild(el);const a={el,p,x:35+(i%3)*13,y:35+Math.floor(i/3)*15,phase:Math.random()*6.28};el.style.left=a.x+'%';el.style.top=a.y+'%';setTimeout(()=>go(a),350+i*180);return a}
function go(a){const target=pick(homes[a.p.activity]),dx=target[0]-a.x;a.el.dataset.dir=dx<0?'left':'right';a.el.dataset.action='walk';a.el.querySelector('.bubble').classList.remove('show');const m=Math.round(rnd(850,1250)/speed[a.p.momentum]);a.el.style.setProperty('--move',m+'ms');a.x=target[0]+rnd(-2,2);a.y=target[1]+rnd(-2,2);a.el.style.left=a.x+'%';a.el.style.top=a.y+'%';setTimeout(()=>{a.el.dataset.action=action[a.p.activity];const b=a.el.querySelector('.bubble');b.textContent=copy[a.p.activity];b.classList.add('show');setTimeout(()=>wander(a),rnd(1800,3500)/speed[a.p.momentum])},m+60)}
function wander(a){if(a.p.activity==='review_wait'||a.p.activity==='paused'){go(a);return}const home=pick(homes[a.p.activity]);a.el.dataset.action='walk';a.el.dataset.dir=home[0]-a.x<0?'left':'right';const m=Math.round(rnd(500,850)/speed[a.p.momentum]);a.el.style.setProperty('--move',m+'ms');a.x=home[0]+rnd(-5,5);a.y=home[1]+rnd(-4,4);a.el.style.left=a.x+'%';a.el.style.top=a.y+'%';setTimeout(()=>{a.el.dataset.action=action[a.p.activity];setTimeout(()=>wander(a),rnd(1600,3300)/speed[a.p.momentum])},m)}
const actors=projects.map(add);function live(t){actors.forEach(a=>{const act=a.el.dataset.action,s=speed[a.p.momentum],amp=act==='walk'?1.7:act==='work'?1.05:act==='rest'?.3:.55;const y=Math.sin(t*.005*s+a.phase)*amp,x=act==='work'?Math.sin(t*.018*s+a.phase)*.65:0;a.el.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`});requestAnimationFrame(live)}if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(live)})();
</script></body></html>
