<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f0eb">
<title>COCKPID — Calendar / Workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23f1f0eb'/%3E%3Cpath d='M42 21a16 16 0 1 0 0 22' fill='none' stroke='%23292924' stroke-width='6' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="stylesheet" href="calendar-daybook.css">
<link rel="stylesheet" href="week-horizontal.css">
<link rel="stylesheet" href="zen-memo.css">
<style>
.month-grid{grid-template-rows:30px}
@media(max-width:360px){.view-head{height:70px;flex-basis:70px;flex-direction:column;align-items:stretch;gap:2px}.view-nav{margin-left:0;justify-content:flex-end}}
</style>
</head>
<body>
<div class="calendar-app">
  <header class="calendar-top">
    <div class="calendar-brand"><b>CALENDAR</b><span>TODAY + VIEW</span></div>
    <div class="calendar-tools"><span class="source-status" id="sourceStatus">BOOTING</span><button class="memo-btn" id="memoOpen">＋ MEMO</button></div>
  </header>

  <main class="book">
    <section class="pane today-pane" aria-label="今日の予定">
      <header class="pane-head">
        <div><span class="pane-kicker">TODAY</span><div class="pane-date" id="todayDateLabel">----</div></div>
      </header>
      <div class="pane-content" id="todayContent"><div class="message">READING TODAY…</div></div>
    </section>

    <section class="pane view-pane" aria-label="選択ビュー">
      <header class="view-head">
        <nav class="view-tabs" aria-label="カレンダービュー">
          <button class="view-tab active" data-view="day">DAY</button>
          <button class="view-tab" data-view="week">WEEK</button>
          <button class="view-tab" data-view="month">MONTH</button>
        </nav>
        <div class="view-nav">
          <button class="nav-btn" id="prevView" aria-label="前へ">‹</button>
          <span class="right-date" id="rightDateLabel">----</span>
          <input class="anchor-date" id="anchorDate" type="date" aria-label="基準日を選ぶ">
          <button class="nav-btn" id="nextView" aria-label="次へ">›</button>
        </div>
      </header>
      <div class="pane-content" id="viewContent"><div class="message">READING VIEW…</div></div>
    </section>
  </main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-label="Zen Memo">
  <div class="drawer-head"><strong>ZEN V2 / QUICK MEMO</strong><button class="btn" id="memoClose">CLOSE</button></div>
  <div class="small">mynotebook の <b>00_inbox</b> に新規メモとして保存します。</div>
  <textarea id="memoText" placeholder="ここにメモを書く……"></textarea>
  <div class="drawer-foot"><span class="drawer-status" id="memoStatus">READY</span><button class="btn primary" id="memoSave">POST / CTRL+ENTER</button></div>
  <div class="zen-hint">Ctrl + Enter で投稿。ファイル名: YYYYMMDDHHMMSS.md</div>
  <button class="btn token-toggle" id="tokenToggle">▸ 接続設定を表示</button>
  <div class="token-settings" id="tokenSettings"><div class="token-box"><label>GITHUB FINE-GRAINED TOKEN</label><input id="tokenInput" type="password" autocomplete="off" placeholder="github_pat_…"><div class="small">COCKPID本体と同じ <b>zen-note-github-token</b> を使います。</div><button class="btn token-save" id="tokenSave">TOKENを保存</button></div></div>
</aside>

<script src="prototype-common.js"></script>
<script src="zen-memo.js"></script>
<script src="calendar-daybook.js"></script>
</body>
</html>
