name: Rady original asset import

on:
  push:
    paths:
      - '.rady-import/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild original Rady archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .rady-import/READY
          cat .rady-import/chunk-* > /tmp/rady.zip.b64
          base64 -d /tmp/rady.zip.b64 > /tmp/rady.zip
          mkdir -p workbench/assets/rady/original
          unzip -o /tmp/rady.zip -d workbench/assets/rady/original
          test "$(find workbench/assets/rady/original -maxdepth 1 -name '*.png' | wc -l)" -eq 29

      - name: Switch manifest to originals
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('workbench/assets/rady/manifest.json')
          data = json.loads(manifest_path.read_text())
          data['basePath'] = './assets/rady/original/'
          manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          index_path = Path('workbench/index.html')
          text = index_path.read_text()
          text = text.replace('resident.css?v=20260924-rady-sprite2', 'resident.css?v=20260924-rady-original1')
          text = text.replace('resident.js?v=20260924-rady-sprite2', 'resident.js?v=20260924-rady-original1')
          index_path.write_text(text)
          PY

      - name: Commit original assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .rady-import
          git add -A
          git commit -m "assets: switch Rady to original PNGs"
          git push
