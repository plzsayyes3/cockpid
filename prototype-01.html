<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpid Prototype 01 — Timeline</title><style>:root{--bg:#111315;--p:#191d21;--l:#313840;--t:#eef1f4;--m:#8e98a3;--a:#d9e76a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding-bottom:18px;margin-bottom:22px}h1{margin:0;font-size:22px;letter-spacing:.16em}small,.meta{color:var(--m)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}section{border:1px solid var(--l);background:var(--p);border-radius:14px;padding:16px}h2{font-size:13px;letter-spacing:.12em;margin:0 0 10px}details{border-top:1px solid var(--l);padding:0 0 4px}details:first-of-type{border-top:0}summary{cursor:pointer;padding:13px 2px;color:var(--t);list-style:none}summary::-webkit-details-marker{display:none}summary:before{content:'▶';font-size:10px;margin-right:9px;color:var(--a)}details[open] summary:before{content:'▼'}article{padding:0 20px 12px}article+article{border-top:1px dashed var(--l);padding-top:10px}.date{font-size:11px;color:var(--m);float:right}.item p{font-size:13px;color:#bbc2ca;line-height:1.6}.confidence{font-size:10px;color:var(--a)}button{background:none;border:1px solid var(--l);color:var(--t);padding:7px 10px;border-radius:7px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><body><main><header><div><h1>COCKPID</h1><small>01 / TIMELINE REVIEW</small></div><div id="status">CONNECTING</div></header><div class="grid"><section id="themes"></section><section id="ideas"></section><section id="actions"></section><section class="wide" id="connections"></section></div></main><dialog id="dialog"><input id="tokenInput" type="password"><button id="save">Save</button></dialog><script src="prototype-common.js"></script><script>boot('timeline')</script></body></html>
